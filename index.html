<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abner LiNA | Live Network Monitor & Speed Test</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              500: '#6366f1',
              600: '#4f46e5',
              900: '#312e81',
            },
            cyber: {
              bg: '#0b0f19',
              card: '#111827',
              accent: '#06b6d4',
              pink: '#ec4899',
              green: '#10b981'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    
    .gauge-needle {
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: 100px 100px;
    }

    .glow-cyan {
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.25);
    }

    .glow-indigo {
      box-shadow: 0 0 25px rgba(99, 102, 241, 0.3);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #111827;
    }
    ::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #4b5563;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased selection:bg-brand-500 selection:text-white">

  <!-- Header -->
  <header class="border-b border-gray-800 bg-gray-900/50 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="p-2 bg-indigo-600/20 rounded-lg text-indigo-400 border border-indigo-500/30">
          <i class="fa-solid me-1 fa-network-wired text-xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
            LiNA <span class="text-xs font-semibold px-2 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-800">GitHub Hostable</span>
          </h1>
          <p class="text-xs text-gray-400">Live Network Analizer</p>
        </div>
      </div>
      
      <div class="flex items-center space-x-4">
        <div class="flex items-center space-x-2 text-sm bg-gray-800/80 px-3 py-1.5 rounded-full border border-gray-700">
          <span class="relative flex h-2.5 w-2.5">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
          </span>
          <span class="text-xs font-medium text-gray-300" id="live-status text">Live Monitor Active</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full space-y-8">
    
    <!-- Top Row: Speedometer + Live Diagnostics -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Main Speed Test Card (2 Columns on Large Screens) -->
      <div class="lg:col-span-2 bg-cyber-card border border-gray-800 rounded-2xl p-6 relative overflow-hidden flex flex-col justify-between glow-indigo">
        
        <div class="flex justify-between items-start mb-4">
          <div>
            <h2 class="text-lg font-semibold text-gray-200">Speed Benchmark</h2>
            <p class="text-xs text-gray-400">Measures throughput over CORS-enabled endpoints</p>
          </div>
          <div id="grade-badge" class="hidden px-3 py-1 rounded-full text-sm font-bold border">
            <!-- Grade injected here -->
          </div>
        </div>

        <!-- Speed Gauge Visualizer -->
        <div class="flex flex-col items-center justify-center my-4 relative">
          <svg class="w-64 h-64 sm:w-80 sm:h-80" viewBox="0 0 200 200">
            <!-- Background Track -->
            <path d="M 30 150 A 80 80 0 1 1 170 150" fill="none" stroke="#1f2937" stroke-width="14" stroke-linecap="round" />
            
            <!-- Dynamic Progress Track -->
            <path id="gauge-progress" d="M 30 150 A 80 80 0 1 1 170 150" fill="none" stroke="url(#gauge-gradient)" stroke-width="14" stroke-linecap="round" stroke-dasharray="377" stroke-dashoffset="377" />
            
            <!-- Gradients -->
            <defs>
              <linearGradient id="gauge-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#06b6d4" />
                <stop offset="50%" stop-color="#6366f1" />
                <stop offset="100%" stop-color="#ec4899" />
              </linearGradient>
            </defs>

            <!-- Needle -->
            <g id="needle" class="gauge-needle" style="transform: rotate(-120deg);">
              <line x1="100" y1="100" x2="35" y2="100" stroke="#f3f4f6" stroke-width="3" stroke-linecap="round" />
              <circle cx="100" cy="100" r="6" fill="#63
